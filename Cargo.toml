[package]
name = "termnews"
version = "0.1.0"
edition = "2021"
description = "A terminal news aggregator with tabbed windows for RSS/Atom feeds"
authors = []

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking"] }
rss = "2"
atom_syndication = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
html2text = "0.12"
chrono = { version = "0.4", features = ["serde"] }
